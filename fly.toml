# Fly.io deployment for Wavelength.
#
# One machine, one SQLite file on a volume, WebSockets served by the same
# process. Everything a game needs lives on that machine, which is what makes
# it simple — and why it must stay at exactly one machine: a volume belongs to
# a single machine, so a second one would have its own, different database.

app = "wave-length"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[deploy]
  # A volume cannot be attached to two machines at once, so there is no
  # blue-green: the one machine restarts in place, a gap of several seconds.
  # Games survive it (they are on disk) and clients reconnect on their own,
  # polling in the meantime.
  strategy = "rolling"

[mounts]
  source = "wavelength_data"
  destination = "/data"

[env]
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  # Session cookies are Secure in production, so HTTPS is not optional.

  # Autosuspend when idle; the next request wakes it from a RAM snapshot in
  # well under a second. An open WebSocket counts as an active connection, so
  # a machine with anyone in a game never goes idle. Games live in SQLite on
  # the volume, so nothing is lost either way. min_machines_running must be 0
  # or the single machine is never allowed to suspend.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    # Connections, not requests: an idle WebSocket still occupies one.
    type = "connections"
    soft_limit = 200
    hard_limit = 250

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
